name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Type check (mypy, advisory)
        # Advisory by design (see pyproject.toml's [tool.mypy] comment): the
        # codebase has ~50 pre-existing type errors from before mypy was wired
        # into CI at all. Flipping this to blocking is a real, separate
        # cleanup project, not something to do silently as a side effect of a
        # CI-hardening pass — track it explicitly rather than let it block
        # every future PR on unrelated pre-existing debt.
        run: mypy app || true

      - name: Test
        env:
          APP_ENV: test
        run: pytest -q

  # Migrations must apply cleanly on a real Postgres and match the models.
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image ships the `vector` extension the intelligence
        # migration creates (CREATE EXTENSION vector); stock postgres lacks it.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inwork
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Apply migrations
        env:
          APP_ENV: development
          SECRET_KEY: ci-secret-key-not-used-in-prod-0123456789abcdef
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/inwork
        run: alembic upgrade head

      - name: Check for model/migration drift
        env:
          APP_ENV: development
          SECRET_KEY: ci-secret-key-not-used-in-prod-0123456789abcdef
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/inwork
        # Fails if the models declare a change that isn't reflected in a
        # migration yet (e.g. someone edited a model and forgot to generate
        # one) — catches drift the "apply migrations" step above can't.
        run: alembic check
